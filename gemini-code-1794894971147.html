<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Casuist — Moral & Pastoral Theology Library</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="A Collection of Cases in Moral and Pastoral Theology (Volumes I–V, 1906–1917)">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Clean, readable serif/sans theme from CDN -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #7a1c1c; /* Classic ecclesiastical burgundy accent */
    }
    .markdown-section {
      max-width: 820px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.08rem;
      line-height: 1.75;
    }
    .markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .page-marker {
      display: inline-block;
      background: #f3f4f6;
      color: #6b7280;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 0 6px;
      font-family: monospace;
      font-size: 0.8rem;
      margin-right: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div id="app">Loading The Casuist Library...</div>
  <script>
    window.$docsify = {
      name: 'The Casuist (Vols. I–V)',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3, // Automatically lists Cases in the sidebar when viewing a Volume
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search cases, canons, or topics...',
        noData: 'No matching cases found.',
        depth: 4
      },
      plugins: [
        // Formats printed page markers like |13| into clean badges
        function(hook) {
          hook.beforeEach(function(html) {
            return html.replace(/\|(\d+)\|/g, '<span class="page-marker" title="Printed Page $1">p. $1</span>');
          });
        }
      ]
    }
  </script>
  <!-- Docsify core & full-text search plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
